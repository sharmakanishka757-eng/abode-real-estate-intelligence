services:
  postgres:
    image: postgres:16
    container_name: abode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: abode_user
      POSTGRES_PASSWORD: abode_password
      POSTGRES_DB: abode_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: